name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name pitchly --org com.pitchly.app
          fi

      - name: Ensure INTERNET permission (only permission used)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_KEY=${{ secrets.API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: pitchly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
